# GitHub Actions CI — mirrors .forgejo/workflows/ci.yml. Both call identical `just` recipes.
# setup-just is the one third-party action: GitHub can use its bare name, while Forgejo needs a
# full URL. Keep the two files in sync; the documented Forgejo-only secret-scan omission remains.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: just fmt-check
      - run: just lint
      - run: just gen-check
      - run: just env-check
      - run: just docs-check
      - run: just cover
      - run: just race
      # Go coverage upload to Codacy. GitHub-only (third-party action → not mirrored to
      # .forgejo, per the header note); just cover already emitted coverage.out.
      # Skipped on forks where the secret is unavailable.
      - name: Upload coverage to Codacy
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.out
          force-coverage-parser: go

  # OSS hygiene: SPDX header coverage + the forbidden-words content guard (real terms injected from
  # the FORBIDDEN_WORDS_PATTERN repo secret; the credential-shape layer always runs). Mirrored in
  # .forgejo/workflows/ci.yml (bare checkout → parity).
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - run: just hygiene
        env:
          FORBIDDEN_WORDS_PATTERN: ${{ secrets.FORBIDDEN_WORDS_PATTERN }}

  # Full-history secret scan (gitleaks, pinned docker image). GitHub-only — needs a full-depth
  # checkout; not mirrored to .forgejo (documented divergence).
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - run: just secret-scan

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: internal/control/ui/package-lock.json
      - run: just ui-check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - run: just image
      - run: just compose-check

  e2e:
    runs-on: ubuntu-latest   # must be docker-capable (automount socket or DinD on Forgejo)
    needs: [go]              # warm the module cache + fail fast on a broken build first
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: just e2e

  # Credential-free, report-only comparison of the complete synthetic inventory with the
  # committed substrate-scoped reality corpus. Findings are evidence and do not fail this wave.
  signal-fidelity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: just signal-fidelity

  # Helm chart: lint plus the credential and exposure render permutations. helm is preinstalled on
  # GitHub's ubuntu images, so no third-party action is needed — which also keeps this mirror-safe.
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - run: helm version
      # kubeconform is what actually schema-validates the rendered manifests. It was absent on
      # every runner, and the render suite skipped that leg silently, so the chart's output had
      # never once been checked against the Kubernetes API schemas despite the check being part of
      # the suite. REQUIRE_KUBECONFORM makes a missing binary fail instead of skip.
      - name: install kubeconform
        run: |
          set -euo pipefail
          version=v0.7.0
          # Checksum verified locally against the published release before pinning. Piping the
          # download straight into tar would execute whatever the URL served, which for a tool that
          # gates a required check is a supply-chain hole rather than a convenience.
          sha256=c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${version}/kubeconform-linux-amd64.tar.gz" -o /tmp/kubeconform.tgz
          echo "${sha256}  /tmp/kubeconform.tgz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tgz -C /usr/local/bin kubeconform
          kubeconform -v
      - run: just helm-test
        env:
          REQUIRE_KUBECONFORM: "1"
      - run: just lab-check

  # Single aggregator the branch ruleset gates on (`ci-success` required status check). Keeping the
  # ruleset pinned to one check means the job list above can change without touching branch
  # protection. GitHub-only — not mirrored to .forgejo (no fleet ruleset there; documented divergence).
  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    if: always()
    needs: [go, hygiene, secret-scan, ui, docker, e2e, signal-fidelity, helm]
    steps:
      - name: Fail if any required job did not pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "A required job failed or was cancelled: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - name: All required jobs passed
        run: echo "ci-success — ${{ join(needs.*.result, ', ') }}"
