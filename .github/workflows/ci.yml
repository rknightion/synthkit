# GitHub Actions CI — mirrors .forgejo/workflows/ci.yml. Both call identical `just` recipes.
# setup-just is the one third-party action: GitHub can use its bare name, while Forgejo needs a
# full URL. Keep the two files in sync; the documented Forgejo-only secret-scan omission remains.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel a superseded run on the same ref (rapid pushes / PR updates) to free runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: just fmt-check
      - run: just lint
      - run: just gen-check
      - run: just env-check
      - run: just docs-check
      - run: just cover
      - run: just race
      # Go coverage upload to Codacy. GitHub-only (third-party action → not mirrored to
      # .forgejo, per the header note); just cover already emitted coverage.out.
      # Skipped on forks where the secret is unavailable.
      - name: Upload coverage to Codacy
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.out
          force-coverage-parser: go

  # OSS hygiene: SPDX header coverage + the forbidden-words content guard (real terms injected from
  # the FORBIDDEN_WORDS_PATTERN repo secret; the credential-shape layer always runs). Mirrored in
  # .forgejo/workflows/ci.yml (bare checkout → parity).
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      - run: just hygiene
        env:
          FORBIDDEN_WORDS_PATTERN: ${{ secrets.FORBIDDEN_WORDS_PATTERN }}

  # Full-history secret scan (gitleaks, pinned docker image). GitHub-only — needs a full-depth
  # checkout; not mirrored to .forgejo (documented divergence).
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      - run: just secret-scan
      - run: just secret-scan-config

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.12.1
          cache: npm
          cache-dependency-path: internal/control/ui/package-lock.json
      - run: just ui-check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      - run: just image
      - run: just compose-check

  e2e:
    runs-on: ubuntu-latest   # must be docker-capable (automount socket or DinD on Forgejo)
    needs: [go]              # warm the module cache + fail fast on a broken build first
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: just e2e
        env:
          # Temporary safety boundary while SKT-0043 remains unresolved: exercise the
          # complete metric/log/trace surface without loading the ai_agent fixture.
          SYNTHKIT_E2E_INCLUDE_AGENT: 'false'

  # Credential-free comparison of the complete synthetic inventory with the committed
  # substrate-scoped reality corpus. Unexempted contradictions fail; coverage gaps and visible,
  # reasoned exemptions remain report-only evidence.
  signal-fidelity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: just signal-fidelity

  # Helm chart: lint plus the credential and exposure render permutations. helm is preinstalled on
  # GitHub's ubuntu images, so no third-party action is needed — which also keeps this mirror-safe.
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      # `e2e/lab/validate.sh` requires rg; it is not preinstalled on the hosted runner.
      - name: Install lab-check tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
      - run: helm version
      # kubeconform moved to the shared helm-validate reusable below, which
      # verifies the binary against the release's OWN CHECKSUMS file rather than a
      # sha256 transcribed into this repo. The pin here was correct, but sf2loki's
      # was not — right for its first 42 hex characters, confabulated after, and
      # red for six days. A hash nobody types cannot be mistyped.
      #
      # This job keeps everything the reusable has no business knowing: the
      # positive-permutation content assertions, the credential-separation and
      # exposure-mode checks, and the tests/invalid/* fixtures that must FAIL to
      # render. REQUIRE_KUBECONFORM is therefore no longer set — the schema leg is
      # not silently skipped, it is covered by helm-validate.
      - run: just helm-test
      - run: just lab-check

  # Disjoint fixture groups validate every positive fixture at its API floor.
  # Non-HA stays at 1.25.0 because Chart.yaml claims kubeVersion ">=1.25.0-0" and
  # validating only against newer schemas passes manifests the oldest supported
  # cluster would reject. -ignore-missing-schemas stays off, per this repo's own
  # long-standing argument that the flag can pass while validating nothing.
  helm-validate:
    permissions:
      contents: read
    uses: rknightion/.github/.github/workflows/helm-validate.yml@2c2a3771006d75783f612a61a2bd406449a3410f # v1.25.11
    with:
      chart-path: charts/synthkit
      release-name: synthkit
      kubernetes-versions: "1.25.0"
      values-glob: charts/synthkit/ci/*-values.yaml
      schema-locations: >-
        default https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json

  # HA requires the stable AlwaysAllow PDB behavior introduced in Kubernetes 1.31.
  # Serialize calls: the reusable shares a concurrency group and cancels siblings.
  helm-validate-ha:
    needs: [helm-validate]
    permissions:
      contents: read
    uses: rknightion/.github/.github/workflows/helm-validate.yml@2c2a3771006d75783f612a61a2bd406449a3410f # v1.25.11
    with:
      chart-path: charts/synthkit
      release-name: synthkit
      kubernetes-versions: "1.31.0"
      values-glob: charts/synthkit/ci-ha/*-values.yaml
      schema-locations: >-
        default https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json

  # A pull request that closes an issue shows evidence for each of its acceptance criteria. Checks
  # only pull requests with a closing keyword (enforce-all-prs: false), because this repository takes
  # outside and bot pull requests. The reusable fails on any event but pull_request, so it runs on
  # pull requests only. Check run: `ac-evidence / Acceptance evidence`.
  ac-evidence:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: rknightion/.github/.github/workflows/ac-evidence.yml@8f00b7fb896191e598f12ed565395697c539add1 # v1.26.9

  # The lines a pull request adds carry no identifier, email address, public address or credential
  # shape. Pull requests only, like ac-evidence. Check run: `privacy-sweep / Privacy sweep`.
  privacy-sweep:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: rknightion/.github/.github/workflows/privacy-sweep.yml@8f00b7fb896191e598f12ed565395697c539add1 # v1.26.9

  # The Backlog.md board is retired: issues are the queue. A pull request may delete files under
  # backlog/ or move them out, never add or change one there. Reads the file list from the API, so
  # no pull request code is checked out.
  backlog-freeze:
    name: backlog/ is frozen
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Refuse additions and changes under backlog/
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$CHANGED_FILES" =~ ^[0-9]+$ ]]; then
            echo "::error title=backlog freeze::the pull request number or file count is malformed"
            exit 1
          fi
          # The pull request files API lists at most 3000 files; refuse rather than check part of a change.
          if (( CHANGED_FILES > 3000 )); then
            echo "::error title=backlog freeze::${CHANGED_FILES} changed files is more than the API lists; split the pull request"
            exit 1
          fi
          offending="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[] | select(.status != "removed") | select(.filename | startswith("backlog/")) | "\(.status) \(.filename | @json)"')"
          if [[ -n "$offending" ]]; then
            echo "::error title=backlog freeze::this pull request adds or changes files under backlog/; the board is retired, so file the work as an issue"
            printf '  %s\n' "$offending"
            exit 1
          fi
          echo "No file under backlog/ is added or changed."

  # Single aggregator the branch ruleset gates on (`ci-success` required status check). Keeping the
  # ruleset pinned to one check means the job list above can change without touching branch
  # protection. GitHub-only — not mirrored to .forgejo (no fleet ruleset there; documented divergence). The
  # GitHub-only pull request jobs ac-evidence, privacy-sweep and backlog-freeze are not mirrored either.
  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    if: always()
    needs: [go, hygiene, secret-scan, ui, docker, e2e, signal-fidelity, helm, ac-evidence, privacy-sweep, backlog-freeze, helm-validate, helm-validate-ha]
    steps:
      - name: Fail if any required job did not pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        env:
          RESULTS: ${{ join(needs.*.result, ', ') }}
        run: |
          echo "A required job failed or was cancelled: ${RESULTS}"
          exit 1
      # A skipped job reports success, so on a pull request the pull request checks must have
      # actually run and passed. Off a pull request they are skipped by design.
      - name: Fail if a pull request check did not run
        if: ${{ github.event_name == 'pull_request' }}
        env:
          AC_EVIDENCE: ${{ needs.ac-evidence.result }}
          PRIVACY_SWEEP: ${{ needs.privacy-sweep.result }}
          BACKLOG_FREEZE: ${{ needs.backlog-freeze.result }}
        run: |
          if [[ "$AC_EVIDENCE" != "success" || "$PRIVACY_SWEEP" != "success" || "$BACKLOG_FREEZE" != "success" ]]; then
            echo "ac-evidence: ${AC_EVIDENCE}, privacy-sweep: ${PRIVACY_SWEEP}, backlog-freeze: ${BACKLOG_FREEZE}; all must pass on a pull request"
            exit 1
          fi
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ', ') }}
        run: echo "ci-success — ${RESULTS}"
