# Nightly, credential-free capture of real k8s-monitoring collector egress.
name: signal-fidelity-k3d

on:
  schedule:
    - cron: "27 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signal-fidelity-k3d
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install pinned cluster tools
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSLo k3d https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64
          echo "06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0  k3d" | sha256sum --check
          sudo install -m 0755 k3d /usr/local/bin/k3d

          curl -fsSLO https://get.helm.sh/helm-v4.2.4-linux-amd64.tar.gz
          echo "c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3  helm-v4.2.4-linux-amd64.tar.gz" | sha256sum --check
          tar -xzf helm-v4.2.4-linux-amd64.tar.gz
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm

          curl -fsSLo kubectl https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl
          echo "8b8f088da2dab964f853b38464033b1be15ede2839eca751482357c45abdd05a  kubectl" | sha256sum --check
          sudo install -m 0755 kubectl /usr/local/bin/kubectl

          k3d version
          helm version --short
          kubectl version --client

      - name: Capture collector egress
        env:
          LAB_CAPTURE_TIMEOUT_SECONDS: "600"
          LAB_OUTPUT_DIR: ${{ runner.temp }}/signal-fidelity-k3d
        run: make signal-fidelity-k3d

      - name: Publish candidate and findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signal-fidelity-k3d-${{ github.run_id }}
          path: ${{ runner.temp }}/signal-fidelity-k3d/
          if-no-files-found: warn
          retention-days: 14
