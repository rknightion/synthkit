name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '7 4 * * 1'
permissions: {}
jobs:
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@3dacb3010d3967dfa9d7619c2d61dc7af14d72dc # v1.34.1
    with:
      languages: '[{"language":"go","build-mode":"autobuild"},{"language":"actions","build-mode":"none"},{"language":"javascript-typescript","build-mode":"none"}]'
      timeout-minutes: 30