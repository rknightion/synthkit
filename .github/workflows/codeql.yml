name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '7 4 * * 1'
permissions: {}
jobs:
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@9278035a95cca2de3e202817e536fc7f9fc774fc # v1.34.0
    with:
      languages: '[{"language":"go","build-mode":"autobuild"},{"language":"actions","build-mode":"none"},{"language":"javascript-typescript","build-mode":"none"}]'
      timeout-minutes: 30