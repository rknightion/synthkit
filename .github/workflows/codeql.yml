name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '7 4 * * 1'
permissions: {}
jobs:
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@20533b678728ec119e52401c1e48b31f3c8b83c4 # v1.32.5
    with:
      languages: '[{"language":"go","build-mode":"autobuild"},{"language":"actions","build-mode":"none"},{"language":"javascript-typescript","build-mode":"none"}]'
      timeout-minutes: 30