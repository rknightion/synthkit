# Release automation. On every push to main, release-please maintains a "release PR" that accrues
# changes and, from the Conventional Commits since the last release, computes the next semver and
# updates CHANGELOG.md. Merging that PR tags vX.Y.Z, creates the GitHub Release (notes = that
# version's changelog section), and triggers the publish below.
#
# NB: publish runs HERE, gated on release_created — NOT via the v* tag-push event — because a tag
# created with GITHUB_TOKEN does not trigger other workflows. Likewise the release PR is opened with
# GITHUB_TOKEN, so CI does not auto-run on it; merge it as a repo admin (branch protection's
# enforce_admins=false lets admins bypass) — its content (changelog + version bump) was already
# validated when the underlying commits landed.
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:   # manual re-trigger (e.g. after a config change)

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create the release commit, tag, and GitHub Release
      pull-requests: write      # open/update the release PR
      id-token: write # exchanged for a tailnet identity and an OpenBao token
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Mints a short-lived GitHub App installation token scoped to THIS repo,
      # replacing RELEASE_PLEASE_TOKEN -- a PAT scoped across every rknightion repo.
      # Nothing durable is stored here to leak. The release PR's author becomes the
      # App rather than rknightion; CI still runs unattended on it, because the
      # action_required gate applies to github-actions[bot], not to bot identities
      # generally -- Renovate, a GitHub App, already runs fine.
      #
      # Releases now depend on camden being up, unsealed and on the tailnet; a
      # failure here is infrastructure, not the commit.
      - name: Mint a scoped release token
        id: bao
        uses: rknightion/.github/.github/actions/broker-token@b9ab5f80961f2c29c47a8d7d5dff112b6551169c
        with:
          permission-set: release-please-synthkit
          tailscale-client-id: ${{ secrets.TS_WIF_CLIENT_ID }}
          tailscale-audience: ${{ secrets.TS_WIF_AUDIENCE }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.bao.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Dispatch at the freshly-created tag ref, then wait for publication and the published-image gate.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch the tag-context publisher and wait for its gate
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          revision=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)
          request_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          expected_title="publish ${RELEASE_TAG} request=${request_id}"
          gh workflow run publish.yml --ref "${RELEASE_TAG}" \
            -f "release_tag=${RELEASE_TAG}" -f "request_id=${request_id}"
          run_id=""
          for _attempt in $(seq 1 30); do
            run_id=$(gh run list --workflow publish.yml --event workflow_dispatch \
              --branch "${RELEASE_TAG}" --limit 20 --json databaseId,displayTitle,headSha | \
              jq -r --arg title "${expected_title}" --arg sha "${revision}" \
                '[.[] | select(.displayTitle == $title and .headSha == $sha) | .databaseId][0] // empty')
            [ -n "${run_id}" ] && break
            sleep 2
          done
          [ -n "${run_id}" ] || { echo "publisher run was not created" >&2; exit 1; }
          gh run watch "${run_id}" --exit-status
