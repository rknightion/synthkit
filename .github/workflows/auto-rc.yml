# Automatic release candidates. On every push to main that passes CI, cut
# vX.Y.Z-rc.N against the version release-please is already staging in its open
# release PR, then publish the image for it.
#
# The stable release path (release-please.yml) is untouched: it still opens and
# maintains the release PR, and a stable release still requires an explicit
# merge. The RC path never writes to the changelog or the release PR.
#
# No binaries job here: this repo ships no .goreleaser config (image-only release).
name: auto-rc

# Fires off CI's completion rather than the push itself. The old `push:` trigger
# started this workflow immediately and then burned a runner slot in
# `rc / wait-for-ci` polling for a CI run still queued behind it — 20.6
# runner-hours of pure polling fleet-wide, and 5 of 17 in-flight jobs at one
# sample. workflow_run fires only once CI has a verdict.
#
# `workflows:` matches the workflow's `name:` field, NOT its filename. If that
# name changes this silently stops firing and RCs stop being cut, with no error.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  # Never cancel a half-published RC; serialize instead.
  group: auto-rc
  cancel-in-progress: false

jobs:
  rc:
    # workflow_run fires for FAILED and cancelled runs too, so the conclusion
    # check is what actually gates the RC on green CI.
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write      # create the RC tag and the GitHub prerelease
      pull-requests: read  # find the open release-please PR
      checks: read         # poll ci-success for this commit
    uses: rknightion/.github/.github/workflows/auto-rc.yml@97f4a7ad0cd1ddd83562a30b9061ef8295242405 # v1.14.0
    with:
      # Under workflow_run, github.sha is the DEFAULT BRANCH HEAD, not the
      # commit CI ran on — it races ahead on rapid pushes. head_sha is the
      # commit the triggering run actually tested.
      sha: ${{ github.event.workflow_run.head_sha }}
      image-ref: ghcr.io/rknightion/synthkit

  # Same image path a stable release takes, just with an RC tag.
  # container-publish suppresses `latest` for any tag containing '-', so an RC
  # can never steal Latest from a stable release.
  #
  # publish.yml also publishes the edge :main image for this push. The RC is dispatched at the
  # freshly-created tag ref so OCI metadata, binary identity, signature and provenance all bind to
  # the release context; this job waits for that separate published-image gate to finish.
  publish:
    needs: rc
    if: needs.rc.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch the tag-context publisher and wait for its gate
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.rc.outputs.tag }}
        run: |
          revision=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq .sha)
          request_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          expected_title="publish ${RELEASE_TAG} request=${request_id}"
          gh workflow run publish.yml --ref "${RELEASE_TAG}" \
            -f "release_tag=${RELEASE_TAG}" -f "request_id=${request_id}"
          run_id=""
          for _attempt in $(seq 1 30); do
            run_id=$(gh run list --workflow publish.yml --event workflow_dispatch \
              --branch "${RELEASE_TAG}" --limit 20 --json databaseId,displayTitle,headSha | \
              jq -r --arg title "${expected_title}" --arg sha "${revision}" \
                '[.[] | select(.displayTitle == $title and .headSha == $sha) | .databaseId][0] // empty')
            [ -n "${run_id}" ] && break
            sleep 2
          done
          [ -n "${run_id}" ] || { echo "publisher run was not created" >&2; exit 1; }
          gh run watch "${run_id}" --exit-status
