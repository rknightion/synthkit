# TEST FIXTURE ONLY, NEVER DEPLOY. Rates/probability endpoints force bounded execution cases.
# CPU substrate only; no live integrations, sources, payloads, secrets or command output.
name: ai-factory-automation
label: ai-factory-automation
shape: business_hours_plateau
timezone: UTC
environments:
  - name: test
    weight: 1
    production: true
    cloud: {provider: aws, account_id: "111122223347", region: us-east-1, vpc_id: vpc-automation-fixture}
    cluster:
      type: eks
      name: automation-fixture-cpu
      # One CPU node is sufficient for this isolated telemetry fixture, not estate sizing.
      node_groups: [{name: cpu, instance_type: m6i.xlarge, desired: 1}]
workloads:
  - type: app
    name: automation-node-provisioning
    runs_on: automation-fixture-cpu
    # Test-only rate: one invocation/second to exercise emission in the first tick.
    traffic: {off_peak_rps: 1, peak_rps: 1}
    services:
      - {name: automation-node-provisioning-controller, type: job, entry: true, namespace: platform-automation, runtime: go, replicas: 1}
    automation:
      name: "Node provisioning"
      steps:
        - name: maintenance
          approval: {duration_ms: 1000, rejection_probability: 0}
        - name: provision-node
          http: {method: POST, url: "https://provisioner.example/v1/nodes", duration_ms: 100, max_attempts: 3, failure_probability: 0, retry_success_probability: 1}
        - name: verify-node
          http: {method: GET, url: "https://provisioner.example/v1/nodes/ready", duration_ms: 100, max_attempts: 3, failure_probability: 0, retry_success_probability: 1}
  - type: app
    name: automation-firmware-rollout
    runs_on: automation-fixture-cpu
    # Test-only rate: one invocation/second to exercise emission in the first tick.
    traffic: {off_peak_rps: 1, peak_rps: 1}
    services:
      - {name: automation-firmware-rollout-controller, type: job, entry: true, namespace: platform-automation, runtime: go, replicas: 1}
    automation:
