        - name: drain
          http: {method: POST, url: "https://maintenance.example/v1/drain", duration_ms: 100, max_attempts: 3, failure_probability: 0, retry_success_probability: 1}
        - name: maintain
          http: {method: POST, url: "https://maintenance.example/v1/maintain", duration_ms: 100, max_attempts: 3, failure_probability: 0, retry_success_probability: 1}
        - name: return-to-service
          http: {method: POST, url: "https://maintenance.example/v1/return", duration_ms: 100, max_attempts: 3, failure_probability: 0, retry_success_probability: 1}
        - name: verify-readiness
