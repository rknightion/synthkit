        - name: stage-rollout
          http: {method: POST, url: "https://firmware.example/v1/rollouts/stage", duration_ms: 100, max_attempts: 3, failure_probability: 0, retry_success_probability: 1}
        - name: apply-rollout
          http: {method: POST, url: "https://firmware.example/v1/rollouts/apply", duration_ms: 100, max_attempts: 3, failure_probability: 0, retry_success_probability: 1}
        - name: verify-version
          http: {method: GET, url: "https://firmware.example/v1/version", duration_ms: 100, max_attempts: 3, failure_probability: 0, retry_success_probability: 1}
  - type: app
    name: automation-drain-return
    runs_on: automation-fixture-cpu
    # Test-only rate: one invocation/second to exercise emission in the first tick.
    traffic: {off_peak_rps: 1, peak_rps: 1}
