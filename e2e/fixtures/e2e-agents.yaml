# e2e-agents — A TEST FIXTURE, NOT A SHIPPED BLUEPRINT. Deliberately outside blueprints/.
#
# Its only job is to make the three sigil lanes (generations + workflow steps + scores) emit
# DETERMINISTICALLY in a single `-once` tick, so the e2e receiver can assert that each lane decodes.
# The activity rates below are therefore ABSURD and must stay absurd — see the note on them.
#
# WHY IT LIVES HERE. This declaration used to sit inside blueprints/otlp-native.yaml, which is the
# documented focused-first-workload blueprint AND is loaded by the standing lab deployment. So a
# rate chosen to force emission inside one 5s test tick was running continuously against a real
# Grafana Cloud stack, producing fake coding-agent traffic at roughly 1200x a real coding agent's
# session rate and with a fraction of its turn depth. It caused problems in the Agent Observability
# product. A test fixture must never ship inside a blueprint an operator can deploy.
#
# If you want realistic agent telemetry, use blueprints/grafana-ai-o11y.yaml. That is the
# agent-observability blueprint, its rates are drawn from real captures, and it is the one to grow.
name: e2e-agents
label: e2e-agents
shape: business_hours_plateau
timezone: Europe/London
metadata:
  description: "E2E TEST FIXTURE ONLY. Forces the three sigil ingest lanes to emit inside one -once tick so the e2e receiver can assert each decodes. Rates are deliberately unrealistic; never deploy this."
  owner: platform-observability
  category: reference
  tags: [test-fixture, sigil, e2e]
  links:
    signals: ./signals/sigil.md

environments:
  - name: prod
    weight: 1.0
    cloud:
      provider: aws
      account_id: "411000000099"
      region: eu-west-1
      vpc_id: vpc-0e2eagents01
    cluster:
      type: eks
      name: e2e-agents-prod-euw1
      node_groups:
        - { name: general, instance_type: m6i.large, desired: 2 }

workloads:
  # Coding agent: generations with tool_use turns. No evals, so no scores from this one.
  # General agent with an evaluator: workflow steps + scores via the online eval rule.
  - type: ai_agent
    name: e2e-ai-agents
    runs_on: e2e-agents-prod-euw1
    otel:
      metrics: true
    resource:
      service_name: e2e-agent
      job: e2e-agent
    agents:
      - name: e2e-coder
        archetype: coding_claude_code
        sdk: sdk-go
        provider: anthropic
        models: [claude-sonnet-4-6]
        tools: [Read, Bash]
        capture_mode: full
        # 600/min is ~50 conversations per 5s tick. NOT a plausible coding agent — a real one is
        # nearer 0.5/min with turns_p50 in the tens (see grafana-ai-o11y). It is here purely so a
        # single -once tick cannot produce zero generations and flake the test. Do not copy it.
        activity: { sessions_per_min: 600, turns_p50: 2, turns_p95: 4 }
      - name: e2e-orchestrator
        archetype: general_orchestration
        sdk: sdk-python
        provider: openai
        models: [gpt-4o-mini]
        tools: [call_tool_a]
        capture_mode: no_tool_content
        # Same reasoning as above: guarantees workflow_steps in -once, and the eval rule then
        # guarantees scores. Unrealistic on purpose.
        activity: { sessions_per_min: 600, turns_p50: 2, turns_p95: 3 }
    evaluators:
      - { name: e2e.helpfulness, kind: heuristic, score_key: e2e_helpfulness, value_type: number }
    rules:
      - { name: e2e.eval_rule, selector: user_visible_turn, sample_rate: 1.0, match_agent: [e2e-orchestrator], evaluators: [e2e.helpfulness] }
