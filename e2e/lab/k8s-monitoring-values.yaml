# Synthkit SKT-0006.03 capture-lab values.
#
# Chart pin: grafana/k8s-monitoring 4.4.0 from https://grafana.github.io/helm-charts.
# The run script passes --version 4.4.0 as a second, executable pin. Every enabled
# destination below is the in-cluster capture receiver; no hosted destination or
# credential is valid in this file.
#
# The receiver uses a short-lived, self-signed certificate generated by run.sh. Alloy
# therefore skips certificate verification for this throw-away lab only. The certificate
# and private key are mounted into the receiver from a temporary Kubernetes Secret; no
# secret material is committed here.

global:
  # Keep the scrape loop short enough for a one-shot lab while retaining real collector
  # behaviour (the reference values use the chart default cadence in production).
  scrapeInterval: 15s
  scrapeTimeout: 5s
  scrapeNativeHistograms: false

cluster:
  name: synthkit-k3s-lab

destinations:
  # Explicit protocol 1 is intentional: SKT-0006.03 must prove the real chart's
  # Prometheus Remote-Write v1 egress at the collector boundary.
  capture-prometheus:
    type: prometheus
    url: https://synthkit-skt000603-receiver.monitoring.svc.cluster.local:9099/api/prom/push
    remoteWriteProtocol: 1
    tls:
      insecureSkipVerify: true

  capture-loki:
    type: loki
    url: https://synthkit-skt000603-receiver.monitoring.svc.cluster.local:9099/loki/api/v1/push
    tls:
      insecureSkipVerify: true

  capture-otlp:
    type: otlp
    protocol: http
    # The local receiver is not a hosted OTLP endpoint, so disable the chart's
    # hosted-endpoint shape validation while retaining all protocol checks in Alloy.
    protocolValidation: false
    url: https://synthkit-skt000603-receiver.monitoring.svc.cluster.local:9099/otlp
    metrics:
      enabled: true
    logs:
      enabled: true
    traces:
      enabled: true
    tls:
      insecureSkipVerify: true

collectors:
  alloy-metrics:
    presets:
      - clustered
      - statefulset
  alloy-singleton:
    presets:
      - singleton
  alloy-receiver:
    presets:
      - clustered
      - deployment
  # Node and pod log collection need host access and the filesystem-log-reader
  # mount. Profiling remains disabled because the existing capture receiver has no
  # profile route; enabling it would create an unverified data path.
  alloy-daemon:
    presets:
      - root
      - host-network
      - host-storage
      - host-cgroup
      - filesystem-log-reader
      - clustered
      - daemonset
    alloy:
      stabilityLevel: public-preview

clusterMetrics:
  enabled: true
  collector: alloy-metrics
  destinations:
    - capture-prometheus
  controlPlane:
    enabled: false
  kubeletProbes:
    enabled: true
  kubeDNS:
    enabled: true
  kubeProxy:
    enabled: true
  # k3d does not deploy kube-state-metrics in this lab. Kubelet/cAdvisor and API
  # discovery still provide real cluster metrics without an extra workload image.
  kube-state-metrics:
    enabled: false

annotationAutodiscovery:
  enabled: true
  collector: alloy-metrics
  destinations:
    - capture-prometheus
  namespaces:
    - otel-demo
  # Keep the standard prometheus.io/* annotation contract used by the workload deck.
  annotations:
    scrape: prometheus.io/scrape
    job: prometheus.io/job
    instance: prometheus.io/instance
    metricsPath: prometheus.io/path
    metricsPortNumber: prometheus.io/port
    metricsScheme: prometheus.io/scheme

prometheusOperatorObjects:
  enabled: true
  collector: alloy-metrics
  destinations:
    - capture-prometheus
  crds:
    deploy: true
  podMonitors: {}
  serviceMonitors: {}
  probes: {}
  scrapeConfigs: {}

clusterEvents:
  enabled: true
  collector: alloy-singleton
  destinations:
    - capture-loki

nodeLogs:
  enabled: true
  collector: alloy-daemon
  destinations:
    - capture-loki

podLogsViaOpenTelemetry:
  enabled: true
  collector: alloy-daemon
  destinations:
    - capture-otlp
  namespaces:
    - otel-demo
  # The workload is installed before the chart; retain its initial stdout lines and
  # the continuing heartbeat lines so the receiver positively observes OTLP logs.
  onlyGatherNewLogLines: false

applicationObservability:
  enabled: true
  collector: alloy-receiver
  destinations:
    - capture-otlp
  receivers:
    otlp:
      grpc:
        enabled: true
        port: 4317
      http:
        enabled: true
        port: 4318

# The capture receiver intentionally has no Pyroscope/profile HTTP route. Keep both
# profile-producing chart features off and call this out in the findings report rather
# than claiming a profile capture that cannot be decoded.
profiling:
  enabled: false
profilesReceiver:
  enabled: false

# Beyla/eBPF auto-instrumentation is not viable for the minimal busybox workload deck;
# the optional applicationObservability receiver remains enabled for a future OTLP sender.
autoInstrumentation:
  enabled: false

kubernetesManifests:
  enabled: true
  collector: alloy-singleton
  destinations:
    - capture-loki

telemetryServices:
  # Required by kubernetesManifests; this is a chart-provided helper, not a cloud
  # destination or credential-bearing workload.
  k8s-manifest-tail:
    deploy: true
    config:
      objects:
        - apiVersion: v1
          kind: Pod
        - apiVersion: apps/v1
          kind: Deployment
        - apiVersion: apps/v1
          kind: DaemonSet

selfReporting:
  # Avoid an unrelated periodic series in a one-shot capture; all requested feature
  # lanes above remain enabled and explicitly destination-scoped.
  enabled: false
