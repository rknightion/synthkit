# The capture receiver is the only in-cluster egress endpoint used by the lab.
# run.sh creates the referenced Secret from a short-lived certificate and key.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synthkit-skt000603-receiver
  namespace: monitoring
  labels:
    app.kubernetes.io/name: synthkit-skt000603-receiver
    app.kubernetes.io/component: capture-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: synthkit-skt000603-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synthkit-skt000603-receiver
        app.kubernetes.io/component: capture-receiver
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
      containers:
        - name: receiver
          image: synthkit-skt000603/receiver:4.5.0-lab
          imagePullPolicy: Never
          env:
            - name: RECEIVER_ADDR
              value: ":9099"
            - name: RECEIVER_TLS_CERT_FILE
              value: /tls/tls.crt
            - name: RECEIVER_TLS_KEY_FILE
              value: /tls/tls.key
          ports:
            - name: https
              containerPort: 9099
              protocol: TCP
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /__inventory
              port: https
            initialDelaySeconds: 1
            periodSeconds: 3
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: receiver-tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: receiver-tls
          secret:
            secretName: synthkit-skt000603-receiver-tls
            # The image runs as a non-root UID. The key is ephemeral and is only
            # made readable by this pod for the duration of the throw-away lab.
            defaultMode: 0444
---
apiVersion: v1
kind: Service
metadata:
  name: synthkit-skt000603-receiver
  namespace: monitoring
  labels:
    app.kubernetes.io/name: synthkit-skt000603-receiver
    app.kubernetes.io/component: capture-receiver
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: synthkit-skt000603-receiver
  ports:
    - name: https
      port: 9099
      targetPort: https
      protocol: TCP
