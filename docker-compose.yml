services:
  synthkit:
    # Pulls the published multi-arch image from GHCR (built + signed by CI). The default tag
    # `main` is the pre-release default and includes the delivery-aware `-healthcheck` command.
    # Override the tag in .env via SYNTHKIT_IMAGE_TAG — use a released `vX.Y.Z` only when that
    # release includes `synthkit -healthcheck` (older images become unhealthy under this Compose
    # contract). SKT-0005.14 will replace this mutable pre-release default with the first eligible
    # pinned release after its image metadata and rollback path are verified.
    # To BUILD from local source instead of pulling, layer the build override:
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ghcr.io/rknightion/synthkit:${SYNTHKIT_IMAGE_TAG:-main}
    # `latest`/`main` are mutable tags — always re-check the registry on `up` so a plain
    # `docker compose up -d` (after `git pull`) actually picks up the newest published digest.
    pull_policy: always
    restart: unless-stopped
    # ALL configuration + credentials come from .env (gitignored — never commit secrets here):
    #   - synthetic sinks  (GC_TOKEN, GC_PROM_RW/OTLP/LOKI …)         → the synthetic-data stack
    #   - self-obs OTLP    (SELFOBS_ENABLED, GC_SELF_OTLP_* )         → a SEPARATE self-obs stack
    #   - self-profiling   (SELFOBS_ENABLED, GC_PYROSCOPE_* )         → a SEPARATE self-obs stack
    #   - SM/FM provision  (GC_SM_*, GC_FM_* )                        → control-plane tools
    # The self-obs paths (OTLP + profiles) use their OWN tokens (never GC_TOKEN). Both share the
    # SELFOBS_ENABLED master switch, are suppressed under DRY_RUN, and ship only when their creds are set.
    env_file: .env
    environment:
      BLUEPRINTS: /app/blueprints
      # Runtime selection. Empty (the safe default) starts setup mode and emits nothing;
      # set exact names such as otlp-native, or use * only to load the complete catalog.
      BLUEPRINT_NAMES: ${BLUEPRINT_NAMES:-}
      # Override the loopback-safe direct-run default only inside the container so Docker can
      # reach the process through its port mapping. SYNTHKIT_BIND still controls host exposure.
      JSON_HTTP_ADDR: 0.0.0.0:8088
      # Repeat the exact Compose-interpolated host bind inside the container. `env_file` alone is
      # insufficient because a shell/--env-file override can change port publication independently.
      SYNTHKIT_BIND: ${SYNTHKIT_BIND:-127.0.0.1}
      # State must live on the mounted /data volume (the distroless rootfs is read-only and
      # nonroot). The ./control-state.json default would silently fail to persist every tick.
      # compose `environment` overrides `env_file`, so a local relative default never leaks in.
      # See the ./control-state-data:/data bind mount below.
      CONFIG_SNAPSHOT_PATH: /data/control-state.json
      # Custom + git blueprints are persisted on the same /data volume so they survive restarts.
      # Subdirectory layout: custom/ (uploads), git/<id>/ (fetched git sources), .boot-manifest.json.
      BLUEPRINT_DATA_DIR: /data/blueprints
    ports:
      # JSON_HTTP_ADDR (:8088) serves the operator control plane (/control/ui) + the Infinity JSON
      # datasource host (/) over plain HTTP. SAFE BY DEFAULT: binds loopback only. Any non-loopback
      # bind also requires CONTROL_TOKEN plus CONTROL_EXPOSURE_ACK=trusted-network or tls-proxy;
      # startup fails closed otherwise. Prefer a browser-trusted HTTPS proxy such as `tailscale serve`.
      - "${SYNTHKIT_BIND:-127.0.0.1}:8088:8088"
    volumes:
      # DIRECTORY bind mount, owned by uid 65532 (distroless nonroot) — a single-file
      # mount breaks the control plane's atomic save → state wipe (I25). First run:
      #   Reject symlink/non-directory paths, then use: sudo install -d -o 65532 -g 65532 -m 700 control-state-data
      - ./control-state-data:/data
    # Delivery-aware health: fresh/live deployments remain starting until every intended lane has
    # completed a current successful push and the state volume has passed an atomic write probe.
    # All bundled construct/workload intervals are 60s; allow that full interval plus queue flush.
    healthcheck:
      test: ["CMD", "/app/synthkit", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 75s
    # Container restart = counter reset = a clean rate() window (I29) — intentional;
    # no counter state volume exists or should.
