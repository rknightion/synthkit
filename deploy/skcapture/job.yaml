# deploy/skcapture/job.yaml — Kubernetes Job that runs skcapture in-cluster.
#
# Prerequisites:
#   1. kubectl apply -f deploy/skcapture/rbac.yaml
#   2. Create the passphrase Secret (see below) — keep the passphrase for decryption.
#   3. kubectl apply -f deploy/skcapture/job.yaml
#   4. Wait for the skcapture container, then retrieve the output before the
#      output-hold helper exits (see "Retrieving the output" below).
#
# ─── Creating the passphrase Secret ──────────────────────────────────────────
#   Generate a random passphrase and store it in both your password manager and
#   the cluster Secret. Share the passphrase with the Grafana SE out-of-band
#   (never include it in the capture file or commit it to any repo):
#
#   PASSPHRASE=$(openssl rand -base64 32)
#   echo "Passphrase (keep this): $PASSPHRASE"
#   kubectl -n skcapture create secret generic skcapture-pass \
#     --from-literal=passphrase="$PASSPHRASE"
#
# ─── Retrieving the output ───────────────────────────────────────────────────
#   The Job writes the encrypted capture file to /out/capture.age inside the pod.
#   The output-hold helper keeps the shared emptyDir available for 10 minutes.
#   Wait for the skcapture container itself, then retrieve with kubectl cp before
#   that helper exits; a completed container cannot service kubectl cp.
#
#   POD=$(kubectl -n skcapture get pods -l job-name=skcapture -o jsonpath='{.items[0].metadata.name}')
#   kubectl -n skcapture wait --for=jsonpath='{.status.containerStatuses[?(@.name=="skcapture")].state.terminated.reason}'=Completed pod/$POD --timeout=120s
#   kubectl -n skcapture cp -c output-hold $POD:/out/capture.age ./capture.age
#
#   Then send capture.age + passphrase to your Grafana SE (use separate channels).
#
# ─── Customise before applying ───────────────────────────────────────────────
#   - Replace the image tag with your organisation's registry/tag.
#   - Adjust --exclude-namespaces if you want to include kube-system workloads.
#   - To capture the telemetry's authoritative cluster identity, customise and
#     apply rbac-collector-identity.yaml before this Job.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: batch/v1
kind: Job
metadata:
  name: skcapture
  namespace: skcapture
  labels:
    app.kubernetes.io/name: skcapture
    app.kubernetes.io/component: capture
spec:
  # Keep the completed pod around long enough to kubectl cp the output, then clean up.
  ttlSecondsAfterFinished: 600
  backoffLimit: 0
  template:
    metadata:
      labels:
        job-name: skcapture
        app.kubernetes.io/name: skcapture
    spec:
      serviceAccountName: skcapture
      restartPolicy: Never

      # The output emptyDir is ephemeral — retrieve capture.age before the pod is cleaned up.
      # For long-term storage, replace emptyDir with a PersistentVolumeClaim.
      volumes:
        - name: output
          emptyDir: {}
        - name: passphrase
          secret:
            # Created by the operator before running this Job; see instructions above.
            secretName: skcapture-pass
            items:
              - key: passphrase
                path: pass

      containers:
        - name: skcapture
          # Replace with your registry, e.g. ghcr.io/grafana/skcapture:0.1.0
          image: skcapture:dev
          imagePullPolicy: IfNotPresent

          args:
            - --out=/out/capture.age
            - --passphrase-file=/secrets/pass
            # Exclude standard system namespaces (default). Adjust as needed.
            - --exclude-namespaces=kube-system,kube-node-lease,kube-public

          volumeMounts:
            - name: output
              mountPath: /out
            - name: passphrase
              mountPath: /secrets
              readOnly: true

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]

        # Retains the shared emptyDir only long enough for the operator to copy
        # the encrypted capture. Delete the Job immediately after retrieval.
        - name: output-hold
          image: skcapture:dev
          imagePullPolicy: IfNotPresent
          command: ["/bin/sleep"]
          args: ["600"]
          volumeMounts:
            - name: output
              mountPath: /out
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]

      securityContext:
        # Dockerfile.skcapture pins this non-root identity so Kubernetes can verify it before start.
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
