<?xml version="1.0" encoding="UTF-8"?>
<svg width="640" height="560" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="onboarding-title onboarding-desc" id="onboarding-root"><title id="onboarding-title">From preview to proven delivery</title><desc id="onboarding-desc">Try offline: Inspect one blueprint without credentials.; Run preflight: Check configuration and endpoint access.; Start live emission: Use selected blueprints and your destination.; Query the destination: Confirm fresh, expected series, logs or traces..</desc><defs>
      <style>#onboarding-root { color: #172b35; font-family: "Hanken Grotesk",Arial,sans-serif; }
      #onboarding-root .diagram-container { width:100%;overflow-x:auto }
      #onboarding-root text { font-family:"Hanken Grotesk",Arial,sans-serif;fill:#172b35 }
      #onboarding-root .heading { font-size:28px;font-weight:600 }
      #onboarding-root .name { font-size:12px;font-weight:600 }
      #onboarding-root .sub { font-size:11px;fill:#425965 }
      #onboarding-root .tag { font-family:ui-monospace,monospace;font-size:9px;fill:#425965 }
      #onboarding-root .note { font-size:11px;fill:#425965 }
      #onboarding-root .diagram-container { overflow-x:visible }</style><marker id="onboarding-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#637c88"/></marker></defs><rect width="640" height="560" fill="#ffffff"/><text x="40" y="48" class="heading">From preview to proven delivery</text><path d="M 320 152 L 320 180" fill="none" stroke="#637c88" marker-end="url(#onboarding-arrow)"/><path d="M 320 252 L 320 280" fill="none" stroke="#637c88" marker-end="url(#onboarding-arrow)"/><path d="M 320 352 L 320 380" fill="none" stroke="#637c88" marker-end="url(#onboarding-arrow)"/><g class="node"><rect x="144" y="80" width="352" height="72" rx="6" fill="#ffffff" stroke="#b3c3ca"/><text x="160" y="104" class="name">Try offline</text><text x="160" y="124" class="sub">Inspect one blueprint without credentials.</text></g><text x="40" y="108" class="tag">01</text><text x="40" y="128" class="tag">LOCAL</text><g class="node"><rect x="144" y="180" width="352" height="72" rx="6" fill="#ffffff" stroke="#b3c3ca"/><text x="160" y="204" class="name">Run preflight</text><text x="160" y="224" class="sub">Check configuration and endpoint access.</text></g><text x="40" y="208" class="tag">02</text><text x="40" y="228" class="tag">SETUP</text><g class="node"><rect x="144" y="280" width="352" height="72" rx="6" fill="#ffffff" stroke="#b3c3ca"/><text x="160" y="304" class="name">Start live emission</text><text x="160" y="324" class="sub">Use selected blueprints and your destination.</text></g><text x="40" y="308" class="tag">03</text><text x="40" y="328" class="tag">RUNTIME</text><g class="node"><rect x="144" y="380" width="352" height="72" rx="6" fill="#edf6fa" stroke="#1d6a8a"/><text x="160" y="404" class="name">Query the destination</text><text x="160" y="424" class="sub">Confirm fresh, expected series, logs or traces.</text></g><text x="40" y="408" class="tag">04</text><text x="40" y="428" class="tag">VERIFY</text><path d="M40 500H600" stroke="#dbe5e9"/><text x="40" y="528" class="note">Preflight success checks setup. Destination queries prove delivery.</text></svg>
