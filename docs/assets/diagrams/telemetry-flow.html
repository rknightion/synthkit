<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Model infrastructure. Emit telemetry.</title><style>body{margin:0;background:#fff;color:#172b35;font-family:"Hanken Grotesk",Arial,sans-serif}main{max-width:960px;margin:auto;padding:16px;min-width:0}.diagram-container{width:100%;overflow-x:auto}svg{width:100%;min-width:640px;display:block}text{font-family:"Hanken Grotesk",Arial,sans-serif;fill:#172b35}.heading{font-size:28px;font-weight:600}.name{font-size:12px;font-weight:600}.sub{font-size:11px;fill:#425965}.tag{font-family:ui-monospace,monospace;font-size:9px;fill:#425965}.note{font-size:11px;fill:#425965} @media print{.diagram-container{overflow-x:visible}svg{min-width:0}}</style></head><body><main><div class="diagram-container"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 612" role="img" aria-labelledby="telemetry-flow-title telemetry-flow-desc"><title id="telemetry-flow-title">Model infrastructure. Emit telemetry.</title><desc id="telemetry-flow-desc">A blueprint feeds synthkit; synthetic signals go to configured metrics, traces, logs, profiles, RUM and AI generation destinations.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#637c88"/></marker></defs><rect width="640" height="612" fill="#ffffff"/><text x="40" y="48" class="heading">Model infrastructure. Emit telemetry.</text><path d="M 160 176 L 160 232" fill="none" stroke="#637c88" marker-end="url(#arrow)"/><path d="M 280 260 H 320.0 Q 328.0 260 328.0 252 V 152 Q 328.0 144 336.0 144 H 376" fill="none" stroke="#637c88" marker-end="url(#arrow)"/><path d="M 280 300 L 376 300" fill="none" stroke="#637c88" marker-end="url(#arrow)"/><path d="M 280 340 H 320.0 Q 328.0 340 328.0 348 V 448 Q 328.0 456 336.0 456 H 376" fill="none" stroke="#637c88" marker-end="url(#arrow)"/><g class="node"><rect x="40" y="88" width="240" height="88" rx="6" fill="#ffffff" stroke="#b3c3ca"/><text x="56" y="108" class="tag">DECLARATION</text><text x="56" y="128" class="name">Blueprint</text><text x="56" y="148" class="sub">Describes simulated infrastructure</text><text x="56" y="164" class="sub">and application behaviour.</text></g><g class="node"><rect x="40" y="232" width="240" height="136" rx="6" fill="#edf6fa" stroke="#1d6a8a"/><text x="56" y="252" class="tag">SYNTHKIT</text><text x="56" y="272" class="name">Synthetic generator</text><text x="56" y="292" class="sub">Builds a model and emits signals.</text><text x="56" y="308" class="sub">Does not deploy the declared</text><text x="56" y="324" class="sub">infrastructure.</text></g><g class="node"><rect x="376" y="96" width="224" height="96" rx="6" fill="#ffffff" stroke="#b3c3ca"/><text x="392" y="120" class="name">Metrics</text><text x="392" y="140" class="sub">Remote-Write v2 → Mimir</text><text x="392" y="156" class="sub">Native OTLP → OTLP endpoint</text><text x="392" y="172" class="sub">(when explicitly selected)</text></g><g class="node"><rect x="376" y="252" width="224" height="96" rx="6" fill="#ffffff" stroke="#b3c3ca"/><text x="392" y="276" class="name">Traces and logs</text><text x="392" y="296" class="sub">OTLP traces → OTLP endpoint</text><text x="392" y="312" class="sub">Logs → Loki or native OTLP</text></g><g class="node"><rect x="376" y="408" width="224" height="112" rx="6" fill="#ffffff" stroke="#b3c3ca"/><text x="392" y="432" class="name">Optional signals</text><text x="392" y="452" class="sub">Profiles → Pyroscope</text><text x="392" y="468" class="sub">RUM → Faro</text><text x="392" y="484" class="sub">AI generations → Sigil</text></g><path d="M40 552H600" stroke="#dbe5e9"/><text x="40" y="580" class="note">Arrows show emitted data. Optional paths require matching configuration.</text></svg></div></main></body></html>
