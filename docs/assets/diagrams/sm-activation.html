<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Activate Synthetic Monitoring</title><style>body{margin:0;background:#fff;color:#172b35;font-family:"Hanken Grotesk",Arial,sans-serif}main{max-width:960px;margin:auto;padding:16px;min-width:0}.diagram-container{width:100%;overflow-x:auto}svg{width:100%;min-width:640px;display:block}text{font-family:"Hanken Grotesk",Arial,sans-serif;fill:#172b35}.heading{font-size:28px;font-weight:600}.name{font-size:12px;font-weight:600}.sub{font-size:11px;fill:#425965}.tag{font-family:ui-monospace,monospace;font-size:9px;fill:#425965}.note{font-size:11px;fill:#425965} @media print{.diagram-container{overflow-x:visible}svg{min-width:0}}</style></head><body><main><div class="diagram-container"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="sm-activation-title sm-activation-desc"><title id="sm-activation-title">Activate Synthetic Monitoring</title><desc id="sm-activation-desc">Publish desired snapshot: Emitter records checks; unregistered checks stay silent.; Preview the changes: Inspect the provisioner plan and ownership conflicts.; Explicitly apply: Provisioner reconciles owned resources and registration.; Restart or reacquire: Emitter validates registration against the current snapshot.; Emit registered checks: Verify disposition, then fresh telemetry at the destination..</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#637c88"/></marker></defs><rect width="640" height="660" fill="#ffffff"/><text x="40" y="48" class="heading">Activate Synthetic Monitoring</text><path d="M 320 152 L 320 180" fill="none" stroke="#637c88" marker-end="url(#arrow)"/><path d="M 320 252 L 320 280" fill="none" stroke="#637c88" marker-end="url(#arrow)"/><path d="M 320 352 L 320 380" fill="none" stroke="#637c88" marker-end="url(#arrow)"/><path d="M 320 452 L 320 480" fill="none" stroke="#637c88" marker-end="url(#arrow)"/><g class="node"><rect x="144" y="80" width="352" height="72" rx="6" fill="#ffffff" stroke="#b3c3ca"/><text x="160" y="104" class="name">Publish desired snapshot</text><text x="160" y="124" class="sub">Emitter records checks; unregistered checks stay silent.</text></g><text x="40" y="108" class="tag">01</text><text x="40" y="128" class="tag">EMITTER</text><g class="node"><rect x="144" y="180" width="352" height="72" rx="6" fill="#ffffff" stroke="#b3c3ca"/><text x="160" y="204" class="name">Preview the changes</text><text x="160" y="224" class="sub">Inspect the provisioner plan and ownership conflicts.</text></g><text x="40" y="208" class="tag">02</text><text x="40" y="228" class="tag">OPERATOR</text><g class="node"><rect x="144" y="280" width="352" height="72" rx="6" fill="#ffffff" stroke="#b3c3ca"/><text x="160" y="304" class="name">Explicitly apply</text><text x="160" y="324" class="sub">Provisioner reconciles owned resources and registration.</text></g><text x="40" y="308" class="tag">03</text><text x="40" y="328" class="tag">PROVISION</text><g class="node"><rect x="144" y="380" width="352" height="72" rx="6" fill="#ffffff" stroke="#b3c3ca"/><text x="160" y="404" class="name">Restart or reacquire</text><text x="160" y="424" class="sub">Emitter validates registration against the current snapshot.</text></g><text x="40" y="408" class="tag">04</text><text x="40" y="428" class="tag">EMITTER</text><g class="node"><rect x="144" y="480" width="352" height="72" rx="6" fill="#edf6fa" stroke="#1d6a8a"/><text x="160" y="504" class="name">Emit registered checks</text><text x="160" y="524" class="sub">Verify disposition, then fresh telemetry at the destination.</text></g><text x="40" y="508" class="tag">05</text><text x="40" y="528" class="tag">VERIFY</text><path d="M40 600H600" stroke="#dbe5e9"/><text x="40" y="628" class="note">Apply does not hot-activate a running emitter. Validation must succeed.</text></svg></div></main></body></html>
