<?xml version="1.0" encoding="UTF-8"?>
<svg width="640" height="560" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="contributor-checks-title contributor-checks-desc" id="contributor-checks-root"><title id="contributor-checks-title">One contribution, explicit evidence</title><desc id="contributor-checks-desc">Run focused checks: Exercise the changed behaviour and its failure boundary.; Regenerate when needed: Run just gen for schema, field docs or skill changes.; Run just check: Run the repository pre-commit gate; record failures.; Inspect exact-commit CI: Confirm required jobs, including CI-only coverage..</desc><defs>
      <style>#contributor-checks-root { color: #172b35; font-family: "Hanken Grotesk",Arial,sans-serif; }
      #contributor-checks-root .diagram-container { width:100%;overflow-x:auto }
      #contributor-checks-root text { font-family:"Hanken Grotesk",Arial,sans-serif;fill:#172b35 }
      #contributor-checks-root .heading { font-size:28px;font-weight:600 }
      #contributor-checks-root .name { font-size:12px;font-weight:600 }
      #contributor-checks-root .sub { font-size:11px;fill:#425965 }
      #contributor-checks-root .tag { font-family:ui-monospace,monospace;font-size:9px;fill:#425965 }
      #contributor-checks-root .note { font-size:11px;fill:#425965 }
      #contributor-checks-root .diagram-container { overflow-x:visible }</style><marker id="contributor-checks-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#637c88"/></marker></defs><rect width="640" height="560" fill="#ffffff"/><text x="40" y="48" class="heading">One contribution, explicit evidence</text><path d="M 320 152 L 320 180" fill="none" stroke="#637c88" marker-end="url(#contributor-checks-arrow)"/><path d="M 320 252 L 320 280" fill="none" stroke="#637c88" marker-end="url(#contributor-checks-arrow)"/><path d="M 320 352 L 320 380" fill="none" stroke="#637c88" marker-end="url(#contributor-checks-arrow)"/><g class="node"><rect x="144" y="80" width="352" height="72" rx="6" fill="#ffffff" stroke="#b3c3ca"/><text x="160" y="104" class="name">Run focused checks</text><text x="160" y="124" class="sub">Exercise the changed behaviour and its failure boundary.</text></g><text x="40" y="108" class="tag">01</text><text x="40" y="128" class="tag">DEVELOP</text><g class="node"><rect x="144" y="180" width="352" height="72" rx="6" fill="#ffffff" stroke="#b3c3ca"/><text x="160" y="204" class="name">Regenerate when needed</text><text x="160" y="224" class="sub">Run just gen for schema, field docs or skill changes.</text></g><text x="40" y="208" class="tag">02</text><text x="40" y="228" class="tag">GENERATE</text><g class="node"><rect x="144" y="280" width="352" height="72" rx="6" fill="#ffffff" stroke="#b3c3ca"/><text x="160" y="304" class="name">Run just check</text><text x="160" y="324" class="sub">Run the repository pre-commit gate; record failures.</text></g><text x="40" y="308" class="tag">03</text><text x="40" y="328" class="tag">LOCAL</text><g class="node"><rect x="144" y="380" width="352" height="72" rx="6" fill="#edf6fa" stroke="#1d6a8a"/><text x="160" y="404" class="name">Inspect exact-commit CI</text><text x="160" y="424" class="sub">Confirm required jobs, including CI-only coverage.</text></g><text x="40" y="408" class="tag">04</text><text x="40" y="428" class="tag">CI</text><path d="M40 500H600" stroke="#dbe5e9"/><text x="40" y="528" class="note">Local and CI gates overlap. Neither result implies the other passed.</text></svg>
