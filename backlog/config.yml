project_name: "synthkit"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Parked", "Done"]
definition_of_done:
  - "make gate (build vet test race rw-proto-check spdx-check forbidden-words)"
  - "make blueprint-schema (only if a blueprint field or construct/workload config struct changed)"
  - "DRY_RUN=true go run ./cmd/synthkit -once -dump — inventory diffed against signals/"
labels: []
date_format: yyyy-mm-dd
max_column_width: 20
auto_open_browser: true
default_port: 6420
remote_operations: false
auto_commit: false
filesystem_only: false
zero_padded_ids: 4
bypass_git_hooks: false
check_active_branches: false
active_branch_days: 30
task_prefix: "skt"
