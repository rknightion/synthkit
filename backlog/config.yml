project_name: "synthkit"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Parked", "Done"]
definition_of_done:
  - "just check (fmt-check, lint, gen-check, env-check, docs-check, test, race, hygiene, ui-check, compose-check, helm-test, lab-check, signal-fidelity)"
  - "just gen (only if a blueprint field, construct/workload config struct, or a skill under plugins/synthkit/skills/ changed)"
  - "just dump — inventory diffed against signals/"
labels: []
date_format: yyyy-mm-dd
max_column_width: 20
auto_open_browser: true
default_port: 6420
remote_operations: false
auto_commit: false
filesystem_only: false
zero_padded_ids: 4
bypass_git_hooks: false
check_active_branches: false
active_branch_days: 30
task_prefix: "skt"
