apiVersion: v2
name: synthkit
description: Composable synthetic-telemetry generator — emits structurally correct metrics, traces, logs, profiles, and RUM from YAML blueprints.
type: application

# Chart version is independent of the application version and follows SemVer for the CHART.
version: 0.2.0
# The synthkit release this chart defaults to. Bumped with each synthkit release; overridden
# per-install by image.tag or (preferred) image.digest.
appVersion: "1.3.1"

# The oldest cluster this chart is claimed to run on. Everything it emits is GA at this floor:
# seccompProfile (1.19), networking.k8s.io/v1 Ingress (1.19), topologySpreadConstraints (1.19),
# ttlSecondsAfterFinished (1.23). The render suite schema-validates against this same version, so
# the claim is checked rather than asserted.
kubeVersion: ">=1.25.0-0"

home: https://m7kni.io/synthkit
icon: https://m7kni.io/synthkit/assets/logo.svg
sources:
  - https://github.com/rknightion/synthkit
keywords:
  - observability
  - telemetry
  - synthetic-data
  - grafana
  - prometheus
  - opentelemetry
annotations:
  # Reported by `helm show chart`; the chart itself carries the project's licence.
  licenses: AGPL-3.0-only
