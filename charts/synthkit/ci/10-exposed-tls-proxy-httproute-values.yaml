# Control plane behind a TLS-terminating Gateway API HTTPRoute.
config:
  dryRun: false
  blueprintNames: otlp-native
credentials:
  data:
    existingSecret: synthkit-data
  control:
    existingSecret: synthkit-control
    keys:
      CONTROL_TOKEN: CONTROL_TOKEN
controlPlane:
  exposure:
    ack: tls-proxy
  service:
    enabled: true
  httpRoute:
    enabled: true
    parentRefs:
      - name: tailscale
        namespace: envoy-gateway-system
        sectionName: https
    hostnames:
      - synthkit.k8s.m7kni.io
    rules:
      - path: /
networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system
