# MUST FAIL: a hostname published through Ingress requires tls-proxy acknowledgement.
credentials:
  control:
    existingSecret: synthkit-control
    keys:
      CONTROL_TOKEN: CONTROL_TOKEN
controlPlane:
  exposure:
    ack: trusted-network
  service:
    enabled: true
  ingress:
    enabled: true
    hosts:
      - host: synthkit.example.internal
        paths:
          - path: /
            pathType: Prefix
networkPolicy:
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
