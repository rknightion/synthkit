# A one-character typo Helm would otherwise merge silently: the group renders with no
# existingSecret, so every credential the operator believes they configured is simply absent and
# the failure surfaces as an unauthenticated lane rather than as a bad values file.
# Caught by values.schema.json, not by synthkit.validate — the semantic guards cannot see a key
# that was never set.
credentials:
  data:
    existingSecrets: synthkit-data
