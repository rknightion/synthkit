# MUST FAIL: one hostname may not be published by both the Ingress and HTTPRoute paths.
credentials:
  control:
    existingSecret: synthkit-control
    keys:
      CONTROL_TOKEN: CONTROL_TOKEN
controlPlane:
  exposure:
    ack: tls-proxy
  service:
    enabled: true
  ingress:
    enabled: true
    hosts:
      - host: synthkit.example.internal
        paths:
          - path: /
            pathType: Prefix
  httpRoute:
    enabled: true
    parentRefs:
      - name: gateway
        namespace: gateway-system
    hostnames:
      - synthkit.example.internal
    rules:
      - path: /
networkPolicy:
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gateway-system
