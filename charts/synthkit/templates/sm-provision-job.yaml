{{- if .Values.smProvision.enabled -}}
{{- include "synthkit.validate" . -}}
{{/*
One-shot Synthetic Monitoring provisioner — the Kubernetes form of the Compose sm-provision
profile. Same image as the emitter so snapshot/source-version binding cannot drift.

LEAST PRIVILEGE: it receives GC_SM_URL and GC_SM_TOKEN and nothing else. No synthetic-sink,
self-observability, Fleet, Sigil, git or control credentials reach it.

Preview by default (smProvision.apply=false). Read the Job's log, then set apply=true, bump runId,
and upgrade. It is NOT a Helm hook: hooks would run it automatically on install, which would
destroy the preview-then-apply sequence the provisioner is built around.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-sm-provision-%s" (include "synthkit.fullname" .) .Values.smProvision.runId | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "synthkit.labels" . | nindent 4 }}
    app.kubernetes.io/component: sm-provision
spec:
  ttlSecondsAfterFinished: {{ .Values.smProvision.ttlSecondsAfterFinished }}
  backoffLimit: 0
  {{- if eq .Values.smProvision.stateBackend "kubernetes" }}
  # Engine invocation is capped at 600s; allow orderly joined shutdown before the Job backstop.
  activeDeadlineSeconds: 660
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "synthkit.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: sm-provision
    spec:
      restartPolicy: Never
      {{- if eq .Values.smProvision.stateBackend "kubernetes" }}
      serviceAccountName: {{ include "synthkit.smProvisionPrincipal" . }}
      # Kubernetes projects the dedicated API token/CA/namespace; no shared state volume.
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      {{- else }}
      serviceAccountName: {{ include "synthkit.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if eq .Values.smProvision.stateBackend "file" }}
      # The Job writes the ownership ledger on the emitter's ReadWriteOnce claim, so it has to land
      # on the node already holding that claim.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "synthkit.selectorLabels" . | nindent 18 }}
      {{- end }}
      containers:
        - name: sm-provision
          image: {{ include "synthkit.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/sm-provision"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- if eq .Values.smProvision.stateBackend "kubernetes" }}
            - name: STATE_BACKEND
              value: kubernetes
            - name: STATE_SM_CONFIGMAP
              value: {{ .Values.smProvision.stateConfigMap | quote }}
            - name: SM_PROVISION_LEASE_NAME
              value: {{ .Values.smProvision.leaseName | quote }}
            - name: HA_LEASE_NAME
              value: {{ .Values.smProvision.emitterLeaseName | quote }}
            - name: HA_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: HA_LEASE_DURATION
              value: "30s"
            - name: HA_RENEW_DEADLINE
              value: "15s"
            - name: HA_RETRY_PERIOD
              value: "2s"
            - name: HA_KUBE_REQUEST_TIMEOUT
              value: "2s"
            - name: HA_HTTP_TIMEOUT
              value: "5s"
            - name: HA_FLUSH_TIMEOUT
              value: "8s"
            - name: HA_FENCE_MARGIN
              value: "2s"
            - name: HA_RELEASE_TIMEOUT
              value: "2s"
            - name: STATE_CAS_MAX_ATTEMPTS
              value: "5"
            {{- else }}
            - name: CONFIG_SNAPSHOT_PATH
              value: /data/control-state.json
            {{- end }}
            - name: SM_PROVISION_APPLY
              value: {{ .Values.smProvision.apply | quote }}
            - name: SM_PROVISION_ADOPT_LEGACY
              value: {{ .Values.smProvision.adoptLegacy | quote }}
            - name: SM_PROVISION_MIGRATE_TARGET
              value: {{ .Values.smProvision.migrateTarget | quote }}
            {{- with (include "synthkit.credentialEnv" (dict "root" $ "group" "sm") | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.smProvision.resources | nindent 12 }}
          {{- if eq .Values.smProvision.stateBackend "file" }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "synthkit.pvcName" . }}
        - name: tmp
          emptyDir: {}
      {{- end }}
{{- end }}
