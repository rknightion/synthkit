{{- include "synthkit.validate" . -}}
{{- if .Values.ha.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "synthkit.fullname" . }}
  labels:
    {{- include "synthkit.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      {{- include "synthkit.selectorLabels" . | nindent 6 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "synthkit.fullname" . }}-ha
  labels:
    {{- include "synthkit.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: [{{ .Values.ha.leaseName | quote }}]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - {{ .Values.ha.controlConfigMap | quote }}
      - {{ .Values.ha.bootConfigMap | quote }}
      {{- range $id, $name := .Values.ha.gitSourceConfigMaps }}
      - {{ $name | quote }}
      {{- end }}
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "synthkit.fullname" . }}-ha
  labels:
    {{- include "synthkit.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "synthkit.fullname" . }}-ha
subjects:
  - kind: ServiceAccount
    name: {{ include "synthkit.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
