{{- if .Values.serviceAccount.create -}}
{{- include "synthkit.validate" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "synthkit.serviceAccountName" . }}
  labels:
    {{- include "synthkit.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# synthkit reads no Kubernetes API: it models a cluster rather than observing one, so it needs no
# RBAC and no projected token.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
