# Forgejo Actions CI — the merge guardrail.
#
# Why this exists: Renovate automerges dependency updates, and with `ignoreTests:false`
# (config:recommended default) it WAITS for these checks to pass before merging. So a bump
# that breaks the build — a stale lockfile, a type break from a major, a Dockerfile slip —
# fails here and is never merged. Before this existed, a Renovate @solidjs/router bump shipped
# a package.json/lockfile out of sync and broke the `docker build`.
#
# Assumptions (adjust for your runner): a Forgejo Actions runner labelled `ubuntu-latest`
# with the standard actions (checkout/setup-go/setup-node) reachable. setup-just is the second
# documented divergence from GitHub: Forgejo needs its full GitHub URL; GitHub can use a bare name.
# The first is the omitted secret-scan job. The `docker` job needs a docker-capable runner (DinD or
# a mounted socket) — drop it if your runner can't build images.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: https://github.com/extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: just fmt-check
      - run: just lint
      - run: just gen-check
      - run: just env-check
      - run: just docs-check
      - run: just cover
      - run: just race

  # OSS hygiene: SPDX header coverage + the forbidden-words content guard. Mirrors
  # .github/workflows/ci.yml. The deployment-term layer reads FORBIDDEN_WORDS_PATTERN (a repo
  # secret) when set; otherwise only the always-on credential-shape layer runs. (GitHub additionally
  # runs a gitleaks `secret-scan` job — omitted here to keep bare-action parity.)
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: https://github.com/extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - run: just hygiene
        env:
          FORBIDDEN_WORDS_PATTERN: ${{ secrets.FORBIDDEN_WORDS_PATTERN }}

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: https://github.com/extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: internal/control/ui/package-lock.json
      - run: just ui-check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: https://github.com/extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - run: just image
      - run: just compose-check

  e2e:
    runs-on: ubuntu-latest   # must be docker-capable (automount socket or DinD on Forgejo)
    needs: [go]              # warm the module cache + fail fast on a broken build first
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: https://github.com/extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: just e2e

  # Credential-free, report-only comparison of the complete synthetic inventory with the
  # committed substrate-scoped reality corpus. Unexempted contradictions fail; coverage gaps and
  # visible, reasoned exemptions remain report-only evidence.
  signal-fidelity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: https://github.com/extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - run: just signal-fidelity
