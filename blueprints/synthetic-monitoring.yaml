# synthetic-monitoring — Grafana Synthetic Monitoring estate: HTTP and network checks
# (probe_success / probe_duration families) + Fleet Management collector roster.
# No cloud infrastructure: one minimal environment anchors the blueprint (required
# by validateDecl), but all emitted telemetry flows from the features: block.
# Signal contracts: signals/sm.md, signals/fleet.md.
name: synthetic-checks
label: synmon
shape: business_hours_plateau
timezone: Europe/London
metadata:
  description: "Grafana Synthetic Monitoring estate: HTTP, ping, DNS, TCP/TLS and traceroute checks plus Fleet Management collectors across linux/windows/darwin."
  owner: platform-observability
  category: reference
  tags: [synthetic-monitoring, blackbox, probes, uptime, sm, fleet-management, grafana-cloud]
  links:
    signals-sm: ./signals/sm.md
    signals-fleet: ./signals/fleet.md

environments:
  - name: prod
    weight: 1.0

features:
  synthetic_monitoring:
    enabled: true
    checks:
      - name: synmon-api-health
        target: "https://api.synmon.example.com/health"
        frequency: 60000
        probe: synthkit-private-emea
        region: EMEA
        # Frankfurt city centre, matching the existing default private probe.
        latitude: 50.1109
        longitude: 8.6821
        labels:
          team: platform
          tier: api

      - name: synmon-login
        target: "https://app.synmon.example.com/login"
        frequency: 60000
        probe: synthkit-private-emea
        region: EMEA
        # Frankfurt city centre, matching the existing default private probe.
        latitude: 50.1109
        longitude: 8.6821
        labels:
          team: frontend
          tier: web

      - name: synmon-checkout
        target: "https://app.synmon.example.com/checkout"
        frequency: 120000
        probe: synthkit-private-us
        region: US
        # New York city centre: representative US east-coast probe location.
        latitude: 40.7128
        longitude: -74.0060
        labels:
          team: commerce
          tier: web

      - name: synmon-docs
        target: "https://docs.synmon.example.com/health"
        frequency: 300000
        probe: synthkit-private-emea
        region: EMEA
        # Frankfurt city centre, matching the existing default private probe.
        latitude: 50.1109
        longitude: 8.6821
        labels:
          team: platform
          tier: docs

      - name: synmon-status-page
        target: "https://status.synmon.example.com"
        frequency: 60000
        probe: synthkit-private-apac
        region: APAC
        # Singapore city centre: representative Southeast Asia probe location.
        latitude: 1.3521
        longitude: 103.8198
        labels:
          team: platform
          tier: infra

      # Minute-by-minute reachability is a typical uptime-monitoring cadence.
      # Documentation addresses model a private gateway/resolver; no real probes run.
      - name: synmon-gateway-ping
        type: ping
        target: "192.0.2.1"
        frequency: 60000
        probe: synthkit-private-emea

      - name: synmon-dns
        type: dns
        target: "api.synmon.example.com"
        dns: {server: "192.0.2.53"}
        frequency: 60000
        probe: synthkit-private-emea

      - name: synmon-tls
        type: tcp
        target: "api.synmon.example.com:443"
        tcp: {tls: true}
        frequency: 60000
        probe: synthkit-private-emea

      # Two minutes is the SM traceroute API minimum, suitable for path monitoring.
      - name: synmon-path
        type: traceroute
        target: "api.synmon.example.com"
        frequency: 120000
        timeout: 30000
        probe: synthkit-private-emea

  fleet_management:
    enabled: true
    collectors_per_os:
      linux: 3
      windows: 1
      darwin: 1
