          # Illustrative policy: 1% initial failure, 95% retry success; not captured vendor rates.
          # One-second API acknowledgement budget; not the physical operation duration.
          http: {method: GET, url: "https://maintenance.example/v1/ready", duration_ms: 1000, max_attempts: 3, failure_probability: 0.01, retry_success_probability: 0.95}
  - type: app
    name: automation-storage-provisioning
    for_each_env: true
    # Illustrative estate assumption: approximately four storage allocation requests per site per day.
    # Flat sparse arrivals approximate an operational schedule, not a periodic scheduler.
    traffic: {off_peak_rps: 4.629629629629629e-05, peak_rps: 4.629629629629629e-05}
