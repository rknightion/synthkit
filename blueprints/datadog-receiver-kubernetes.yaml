# Receiver egress example, based on the independently captured Kubernetes path.
# This declares the example metric plus 31 bounded, deterministic CPU, memory, load
# and uptime families grounded in same-producer Agent observations. The remaining 163
# observed families stay unimplemented.
name: datadog-receiver-kubernetes
label: datadog-receiver-kubernetes
shape: business_hours_plateau
metadata:
  description: "Datadog Agent to Alloy receiver: example metric and bounded system families as native OTLP."
  category: reference
  links:
    signals: ./signals/otlp-metrics.md
environments:
  - name: example
    cloud:
      provider: aws
      account_id: "411000000155"
      region: eu-west-1
      vpc_id: vpc-datadog-example
      # This receiver example declares no managed cloud service workload.
      cloudwatch: {albs: 0, s3_buckets: 0, firehose: false, nlb: false, ebs: false, nat_gateway: false, eks: false, private_link: false}
    cluster:
      type: eks
      name: datadog-example-cluster
      # One small application node is sufficient for this single-service example.
      node_groups: [{name: general, instance_type: m6i.large, desired: 1}]
      observability: {cloudwatch: false}
      k8s_monitoring: {enabled: false}
      addons:
        - name: datadog_receiver
          host_name: datadog-example-node
          service_name: example-service
          source: example-agent
          # The captured application's loop increments once, then sleeps 10s:
          # six increments/minute for a small periodic worker. Source-derived,
          # not inferred from elided samples or increased for visibility.
          increments_per_minute: 6
